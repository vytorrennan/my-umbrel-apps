services:
  web:
    image: docker.io/vytor/agent-terminal:1.0.0
    container_name: agent-terminal
    restart: unless-stopped
    ports:
      - "7681:7681"
    volumes:
      - /home/umbrel/umbrel/home/Projects:/home/developer/Projects
      - agent-terminal-data:/home/developer
    environment:
      - TERM=xterm-256color

volumes:
  agent-terminal-data:
