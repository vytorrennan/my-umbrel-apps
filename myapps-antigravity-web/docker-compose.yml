services:
  web:
    image: docker.io/vytor/antigravity-web:1.0.0
    container_name: antigravity-web
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /home/umbrel/umbrel/home/Projects:/home/developer/Projects
      - antigravity-web-data:/home/developer
    environment:
      - PORT=8765
      - NO_TLS=1
      - ALLOW_REMOTE=1
      - ALLOW_ALL=1
      - TERM=xterm-256color

volumes:
  antigravity-web-data:
